name: KiteGrams server — raw MTProto probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.KG_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" > ~/.ssh/config

      - name: Sanity check probe
        run: |
          python3 -c "compile(open('.github/probe.py').read(), 'probe', 'exec')"
          base64 -w0 .github/probe.py > /tmp/probe.b64
          wc -c /tmp/probe.b64

      - name: Upload probe
        run: |
          SSH="ssh -i ~/.ssh/id_rsa -p 2222 -o ConnectTimeout=20 root@2.26.81.165"
          B64=$(cat /tmp/probe.b64)
          $SSH "printf '%s' '$B64' | base64 -d > /tmp/probe.py; wc -c /tmp/probe.py"

      - name: Inspect and probe
        run: |
          SSH="ssh -i ~/.ssh/id_rsa -p 2222 -o ConnectTimeout=20 root@2.26.81.165"
          $SSH 'bash -s' <<'EOF'
          set +e
          echo "=== listening ports ==="
          ss -lntp 2>/dev/null | grep -E ':(443|2398|80)\b' || true
          echo "=== running image ==="
          docker ps --format '{{.Names}} {{.Image}} {{.Status}}' | grep server
          echo "=== image created ==="
          docker inspect -f '{{.Created}} {{.Id}}' kitegrams/server:reqpq64 2>/dev/null
          echo "=== probe (abridged) ==="
          python3 /tmp/probe.py 127.0.0.1 2398 abridged
          echo "=== probe (intermediate) ==="
          python3 /tmp/probe.py 127.0.0.1 2398 intermediate
          echo "=== probe (padded) ==="
          python3 /tmp/probe.py 127.0.0.1 2398 padded
          EOF
