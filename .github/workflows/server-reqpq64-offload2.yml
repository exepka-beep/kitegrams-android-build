name: KiteGrams server — reqpq64 (offload v2)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.KG_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" > ~/.ssh/config

      - name: Start compact source archive on server
        run: |
          SSH="ssh -i ~/.ssh/id_rsa -p 2222 -o ConnectTimeout=20 root@2.26.81.165"
          $SSH 'cat > /tmp/kg_tar.sh' <<'EOF'
          #!/bin/bash
          set -e
          cd /root/gramsrv-src
          rm -f /tmp/kgsrc.tgz /tmp/kgsrc.done
          tar -czf /tmp/kgsrc.tgz Dockerfile.reqpq64 go.mod go.sum cmd internal deploy data
          touch /tmp/kgsrc.done
          EOF
          $SSH 'chmod +x /tmp/kg_tar.sh && nohup /tmp/kg_tar.sh >/tmp/kgsrc.log 2>&1 & echo started'

      - name: Wait and download source archive
        run: |
          SSH="ssh -i ~/.ssh/id_rsa -p 2222 -o ConnectTimeout=20 root@2.26.81.165"
          READY=WAIT
          for i in $(seq 1 40); do
            READY=$($SSH 'test -f /tmp/kgsrc.done && echo READY || echo WAIT' 2>/dev/null || echo WAIT)
            echo "tar: $READY"
            [ "$READY" = READY ] && break
            sleep 15
          done
          test "$READY" = READY
          scp -i ~/.ssh/id_rsa -P 2222 -o ConnectTimeout=20 root@2.26.81.165:/tmp/kgsrc.tgz /tmp/kgsrc.tgz
          mkdir -p /tmp/gramsrv-src
          tar -xzf /tmp/kgsrc.tgz -C /tmp/gramsrv-src
          test -f /tmp/gramsrv-src/Dockerfile.reqpq64
          grep -n "maxHandshakeReqPQ = 64" /tmp/gramsrv-src/internal/mtprotoedge/exchange.go

      - name: Build image on runner
        run: |
          cd /tmp/gramsrv-src
          DOCKER_BUILDKIT=0 docker build -f Dockerfile.reqpq64 --target server \
            --build-arg VCS_REF=reqpq64 \
            --build-arg VCS_BRANCH=main \
            --build-arg VCS_TREE_STATE=clean \
            --build-arg BUILD_DATE=2026-11-27 \
            -t kitegrams/server:reqpq64 .
          docker save kitegrams/server:reqpq64 | gzip -1 > /tmp/kgimage.tgz
          ls -lh /tmp/kgimage.tgz

      - name: Upload image and switch server
        run: |
          SSH="ssh -i ~/.ssh/id_rsa -p 2222 -o ConnectTimeout=20 root@2.26.81.165"
          scp -i ~/.ssh/id_rsa -P 2222 -o ConnectTimeout=20 /tmp/kgimage.tgz root@2.26.81.165:/tmp/kgimage.tgz
          $SSH 'docker load -i /tmp/kgimage.tgz'
          $SSH 'bash -s' <<'EOF'
          set -e
          cd /root/gramsrv-src/deploy/docker
          cp -n .env .env.bak-reqpq64 || true
          sed -i "s/^TELESRV_IMAGE_TAG=.*/TELESRV_IMAGE_TAG=reqpq64/" .env
          grep -n "^TELESRV_IMAGE_TAG=" .env
          docker compose up -d --force-recreate server
          sleep 6
          echo "=== container ==="
          docker ps --format "{{.Names}}\t{{.Image}}\t{{.Status}}" | grep server
          echo "=== server-info ==="
          curl -fsS http://127.0.0.1:2398/owpengram/server-info | head -c 300
          echo
          echo "=== recent log ==="
          docker logs --tail 60 kitegrams-main-server-1 2>&1 | tail -40
          EOF
