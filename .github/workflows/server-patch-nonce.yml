name: KiteGrams server — fresh nonce per req_pq

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.KG_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" > ~/.ssh/config

      - name: Patch exchange_compat.go
        run: |
          B64=''
          ssh -i ~/.ssh/id_rsa -p 2222 -o ConnectTimeout=20 root@2.26.81.165 \
            "echo '$B64' | base64 -d | python3; echo '---'; grep -n -A12 'Received ReqPQ again' /root/gramsrv-src/internal/mtprotoedge/exchange_compat.go"
